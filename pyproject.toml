[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieve context from source files to feed LLM"
readme = "README.md"
authors = [
    { name = "harylax", email = "haryandr23@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fire>=0.7.1",
    "ollama>=0.6.3",
    "pydantic>=2.14.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "flake8-docstrings>=1.7.0",
    "mypy>=2.4.0",
]
